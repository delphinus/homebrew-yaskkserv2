name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Setup tap
        run: |
          mkdir -p $(brew --repo)/Library/Taps/delphinus
          ln -s $GITHUB_WORKSPACE $(brew --repo)/Library/Taps/delphinus/homebrew-yaskkserv2

      - name: Install yaskkserv2 HEAD
        run: |
          brew install --HEAD --build-from-source --verbose yaskkserv2

      - name: Verify installation
        run: |
          which yaskkserv2
          which yaskkserv2_make_dictionary
          yaskkserv2 --version
          yaskkserv2_make_dictionary --help

      - name: Test formula
        run: |
          brew test yaskkserv2

      - name: Audit formula
        run: |
          brew audit --strict yaskkserv2

  karukan-proxy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: karukan-proxy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: karukan-proxy/go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...
